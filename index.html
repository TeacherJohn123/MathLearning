<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級雲端管理系統 v2</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 引入 DOMPurify 防止 XSS 攻擊 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app" class="max-w-5xl mx-auto p-4 md:p-6" v-cloak>
    
    <!-- 頂部導覽與狀態列 -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-white shadow-sm rounded-xl p-4 mb-6">
      <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
        <span>🏫</span> 高年級班級管理系統
      </h1>
      <div class="flex items-center gap-4 mt-4 md:mt-0">
        <!-- 雲端同步狀態燈號 -->
        <div class="flex items-center gap-2 text-sm font-medium px-3 py-1 rounded-full"
             :class="{
               'bg-green-100 text-green-700': syncStatus === '已同步',
               'bg-yellow-100 text-yellow-700': syncStatus === '儲存中...' || syncStatus === '讀取中...',
               'bg-red-100 text-red-700': syncStatus.includes('失敗')
             }">
          <span class="relative flex h-3 w-3">
            <span v-if="syncStatus === '儲存中...' || syncStatus === '讀取中...'" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-current opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-current"></span>
          </span>
          {{ syncStatus }}
        </div>

        <!-- 登入 / 登出按鈕 -->
        <div v-if="!isAdmin" class="flex gap-2">
          <input type="password" v-model="adminPassword" placeholder="輸入管理密碼" 
                 class="border border-slate-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <button @click="login" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1 rounded text-sm transition">登入管理</button>
        </div>
        <div v-else>
          <button @click="logout" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded text-sm transition">登出管理模式</button>
        </div>
      </div>
    </header>

    <!-- 主要內容區 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 左側：學生名單與工作分配 -->
      <div class="lg:col-span-2 space-y-6">
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2"><span>📋</span> 工作分配與名單</h2>
            <button v-if="isAdmin" @click="addStudent" class="text-sm bg-emerald-50 text-emerald-600 px-2 py-1 rounded hover:bg-emerald-100">+ 新增學生</button>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b-2 border-slate-200 text-slate-500">
                  <th class="py-2 px-2 w-16">座號</th>
                  <th class="py-2 px-2 w-24">姓名</th>
                  <th class="py-2 px-2">負責工作 / 備註</th>
                  <th v-if="isAdmin" class="py-2 px-2 w-16 text-center">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(student, index) in classData.students" :key="index" class="border-b border-slate-100 hover:bg-slate-50">
                  <td class="py-2 px-2">
                    <input v-if="isAdmin" type="number" v-model="student.id" class="w-full bg-transparent border-b border-dashed border-slate-300 focus:outline-none focus:border-indigo-500">
                    <span v-else>{{ student.id }}</span>
                  </td>
                  <td class="py-2 px-2">
                    <input v-if="isAdmin" type="text" v-model="student.name" class="w-full bg-transparent border-b border-dashed border-slate-300 focus:outline-none focus:border-indigo-500">
                    <span v-else>{{ student.name }}</span>
                  </td>
                  <td class="py-2 px-2">
                    <input v-if="isAdmin" type="text" v-model="student.task" class="w-full bg-transparent border-b border-dashed border-slate-300 focus:outline-none focus:border-indigo-500">
                    <span v-else>{{ student.task }}</span>
                  </td>
                  <td v-if="isAdmin" class="py-2 px-2 text-center">
                    <button @click="removeStudent(index)" class="text-red-400 hover:text-red-600 text-sm">刪除</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <p v-if="isAdmin" class="text-xs text-slate-400 mt-3 flex items-center gap-1">
            <span>💡</span> 直接修改欄位內容，系統會於停止輸入後 1.5 秒自動存檔至雲端。
          </p>
        </section>

        <!-- 常用連結區塊 -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2"><span>🔗</span> 班級常用連結</h2>
            <button v-if="isAdmin" @click="addLink" class="text-sm bg-blue-50 text-blue-600 px-2 py-1 rounded hover:bg-blue-100">+ 新增連結</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div v-for="(link, index) in classData.links" :key="index" class="p-3 border border-slate-100 rounded-lg flex items-center justify-between group hover:border-blue-200">
              <div v-if="isAdmin" class="flex-1 mr-2 space-y-2">
                <input type="text" v-model="link.title" placeholder="連結名稱" class="w-full text-sm border border-slate-200 rounded px-2 py-1">
                <input type="text" v-model="link.url" placeholder="網址 (https://...)" class="w-full text-sm border border-slate-200 rounded px-2 py-1">
              </div>
              <a v-else :href="link.url" target="_blank" class="text-blue-600 hover:underline flex-1 truncate font-medium">
                {{ link.title }}
              </a>
              <button v-if="isAdmin" @click="removeLink(index)" class="text-red-300 hover:text-red-500 ml-2 text-sm opacity-0 group-hover:opacity-100 transition">✕</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 右側：AI 班級助教 (僅管理員可見) -->
      <div class="lg:col-span-1" v-if="isAdmin">
        <div class="bg-gradient-to-br from-indigo-50 to-blue-50 p-5 rounded-xl border border-indigo-100 h-full flex flex-col">
          <h2 class="text-lg font-bold text-indigo-800 mb-4 flex items-center gap-2"><span>✨</span> AI 班級助教</h2>
          
          <div class="flex-1 bg-white rounded-lg p-4 mb-4 border border-indigo-100 overflow-y-auto max-h-[400px] text-sm leading-relaxed text-slate-700 shadow-inner" v-html="aiResponse">
            <!-- AI 回應會渲染在這裡 -->
          </div>
          
          <div class="mt-auto">
            <textarea v-model="aiPrompt" rows="3" placeholder="例如：幫我寫一段提醒家長明天要帶水彩用具的 LINE 通知訊息..." 
                      class="w-full border border-indigo-200 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 resize-none mb-2"></textarea>
            <button @click="askAI" :disabled="isAiThinking || !aiPrompt.trim()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition disabled:bg-slate-300 disabled:cursor-not-allowed flex justify-center items-center gap-2">
              <span v-if="isAiThinking" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
              {{ isAiThinking ? 'AI 思考中...' : '送出問題' }}
            </button>
          </div>
        </div>
      </div>
      
      <!-- 非管理員看到的右側提示 -->
      <div class="lg:col-span-1" v-else>
        <div class="bg-slate-100 p-6 rounded-xl text-center text-slate-500 h-full flex flex-col justify-center border border-dashed border-slate-300">
          <span class="text-4xl mb-3">🔒</span>
          <p>班級 AI 助教與編輯功能</p>
          <p class="text-sm mt-1">請於右上角登入後開啟</p>
        </div>
      </div>

    </div>
  </div>

  <style>
    /* 避免 Vue 載入前的畫面閃爍 */
    [v-cloak] { display: none; }
  </style>

  <script>
    const { createApp, ref, onMounted, watch } = Vue;

    // 您的 Google Apps Script 後端網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzeHvyp-20JfO9asfARNxCrcdJqHSrtN1fsp7g5Gk8VkIaUDyiyx95UgvXFdh7W9UaGTA/exec';

    // 預設的班級資料結構（當雲端是空的時候使用）
    const defaultData = {
      students: [
        { id: 1, name: '王小明', task: '擦黑板' },
        { id: 2, name: '陳小華', task: '倒垃圾' }
      ],
      links: [
        { title: '均一教育平台', url: 'https://www.junyiacademy.org/' },
        { title: '班級相簿', url: '#' }
      ]
    };

    createApp({
      setup() {
        const classData = ref(JSON.parse(JSON.stringify(defaultData))); 
        const isAdmin = ref(false);
        const adminPassword = ref('');
        const adminToken = ref(localStorage.getItem('adminToken') || '');
        const syncStatus = ref('讀取中...');
        
        const aiPrompt = ref('');
        const aiResponse = ref('<p class="text-slate-400 italic">嗨！我是您的專屬 AI 助教。您可以請我幫忙寫家長通知書、設計課程提問，或是處理行政文字。</p>');
        const isAiThinking = ref(false);
        let isInitialLoad = true; // 防止第一次載入時觸發自動存檔

        // 1. 讀取資料
        const loadData = async () => {
          try {
            syncStatus.value = '讀取中...';
            const res = await fetch(GAS_URL);
            const json = await res.json();
            
            // 確保有抓到資料，且資料不是空的
            if (json.status === 'success' && json.data && Object.keys(json.data).length > 0) {
              classData.value = json.data;
            }
            syncStatus.value = '已同步';
            
            // 延遲解除初始鎖定，確保載入的資料不會馬上觸發 watch 存檔
            setTimeout(() => { isInitialLoad = false; }, 500);
          } catch (e) {
            console.error("雲端讀取失敗", e);
            syncStatus.value = '讀取失敗';
            isInitialLoad = false;
          }
        };

        // 2. 登入與登出
        const login = async () => {
          if (!adminPassword.value) return;
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'verifyAdmin', password: adminPassword.value })
            });
            const json = await res.json();
            
            if (json.status === 'success') {
              isAdmin.value = true;
              adminToken.value = json.token;
              localStorage.setItem('adminToken', json.token);
              adminPassword.value = '';
            } else {
              alert(json.message || "登入失敗");
            }
          } catch (e) {
            alert("連線異常，請檢查網路");
          }
        };

        const logout = () => {
          isAdmin.value = false;
          adminToken.value = '';
          localStorage.removeItem('adminToken');
        };

        // 3. 防抖自動存檔 (Debounce)
        let saveTimeout;
        const autoSave = () => {
          if (!isAdmin.value || !adminToken.value || isInitialLoad) return;
          
          syncStatus.value = '儲存中...';
          clearTimeout(saveTimeout);
          
          saveTimeout = setTimeout(async () => {
            try {
              const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                  action: 'saveData', 
                  token: adminToken.value, 
                  data: classData.value 
                })
              });
              const json = await res.json();
              if (json.status === 'success') {
                syncStatus.value = '已同步';
              } else {
                syncStatus.value = '權限失效';
                logout(); // Token 過期或錯誤則自動登出
              }
            } catch (e) {
              syncStatus.value = '儲存失敗';
            }
          }, 1500); 
        };

        // 4. 呼叫 AI (透過後端)
        const askAI = async () => {
          if (!aiPrompt.value.trim()) return;
          
          isAiThinking.value = true;
          const currentPrompt = aiPrompt.value;
          aiPrompt.value = ''; // 送出後先清空輸入框
          aiResponse.value = '<p class="text-slate-500 animate-pulse">正在思考與生成內容...</p>';
          
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'askAI', prompt: currentPrompt })
            });
            const json = await res.json();
            
            if (json.status === 'success') {
              // 將 AI 回傳的換行符號轉成 <br>，並使用 DOMPurify 過濾
              const formattedHtml = json.data.replace(/\n/g, '<br>');
              aiResponse.value = DOMPurify.sanitize(formattedHtml);
            } else {
              aiResponse.value = `<span class="text-red-500">發生錯誤：${json.message}</span>`;
            }
          } catch (e) {
            aiResponse.value = '<span class="text-red-500">無法連線至 AI 伺服器</span>';
          } finally {
            isAiThinking.value = false;
          }
        };

        // 5. 介面操作函數
        const addStudent = () => {
          const nextId = classData.value.students.length > 0 
            ? Math.max(...classData.value.students.map(s => s.id)) + 1 
            : 1;
          classData.value.students.push({ id: nextId, name: '', task: '' });
        };
        const removeStudent = (index) => {
          if (confirm('確定要刪除這筆資料嗎？')) classData.value.students.splice(index, 1);
        };
        const addLink = () => classData.value.links.push({ title: '', url: '' });
        const removeLink = (index) => {
          if (confirm('確定要刪除這個連結嗎？')) classData.value.links.splice(index, 1);
        };

        // 啟動時執行
        onMounted(() => {
          loadData();
          if (adminToken.value) isAdmin.value = true;
        });

        // 監聽資料變動 (Deep Watch)
        watch(classData, () => {
          autoSave();
        }, { deep: true });

        return { 
          classData, isAdmin, adminPassword, syncStatus, 
          login, logout, askAI, aiPrompt, aiResponse, isAiThinking,
          addStudent, removeStudent, addLink, removeLink
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
